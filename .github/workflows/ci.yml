name: LOBSTER CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  # Job to run change detection
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      py_modified: ${{ steps.changed-py-files.outputs.any_modified }}
      trlc_modified: ${{ steps.changed-trlc-files.outputs.any_modified }}
      only_docu_modified: ${{ steps.changed-docu-files.outputs.only_modified }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - id: changed-py-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        output_renamed_files_as_deleted_and_added: true
        files: |
          *.py
          **/*.py
          *.cfg
          **/*.cfg
    - id: changed-docu-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        output_renamed_files_as_deleted_and_added: true
        files: |
          *.md
          **/*.md
          .github/CODEOWNERS
          documentation/**
    - id: changed-trlc-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        output_renamed_files_as_deleted_and_added: true
        files: |
          *.rsl
          **/*.rsl
          *.trlc
          **/*.trlc
    - name: Debug output
      run: |
        echo "py any_modified: ${{ steps.changed-py-files.outputs.any_modified }}"
        echo "trlc any_modified: ${{ steps.changed-trlc-files.outputs.any_modified }}"
        echo "docu only_modified: ${{ steps.changed-docu-files.outputs.only_modified }}"

  lint-code:
    name: PyLint Code
    needs: changes
    if: ${{ needs.changes.outputs.py_modified == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements_dev.txt
      - name: Executing linter
        run: |
          make lint
  lint-system-tests:
    name: PyLint System Tests
    needs: changes
    if: ${{ needs.changes.outputs.py_modified == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements_dev.txt
      - name: Executing system test linter
        run: |
          make lint-system-tests
  lint-unit-tests:
    name: PyLint Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.py_modified == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements_dev.txt
      - name: Executing unit test linter
        run: |
          make lint-unit-tests
  verify-system-test-entrypoints:
    name: Verify System Test Entrypoints
    needs: changes
    if: ${{ always() && needs.changes.outputs.only_docu_modified == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify unittest main guards in system tests
        run: python3 .github/verify_system_test_entrypoints.py
  trlc:
    name: TRLC
    needs: changes
    if: ${{ needs.changes.outputs.trlc_modified == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Run TRLC
        run: |
          bazel test //lobster:trlc
  test:
    name: TestSuite
    needs: [changes, lint-code, lint-system-tests, verify-system-test-entrypoints, trlc]
    if: ${{ always() && needs.changes.outputs.only_docu_modified == 'false' }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        py-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-14
            brew: "/opt/homebrew"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py-version }}
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements_dev.txt
      - name: Install gnu make on macos
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install make
          echo "${{ matrix.brew }}/opt/make/libexec/gnubin" >> $GITHUB_PATH
      - name: Executing unit tests
        run: |
          make unit-tests
      - name: Unit tests coverage analysis
        run: |
          make coverage-unit
      - name: Executing system tests
        run: |
          make system-tests
      - name: System tests coverage analysis
        run: |
          make coverage-system
  integration-tests:
    name: Integration tests
    needs: [changes, lint-code, lint-system-tests, verify-system-test-entrypoints, trlc]
    if: ${{ always() && needs.changes.outputs.only_docu_modified == 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore clang-tidy cache
        id: restore-clang-tidy
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/work/lobster/llvm-project/build/bin/clang-tidy
          key: cache-clang-tidy
          fail-on-cache-miss: true

      - name: Install python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements_dev.txt
          sudo apt install cmake ninja-build graphviz
      - name: Setup bazel (for lobster-gtest)
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Run integration tests
        run: |
          make integration-tests
  bazel-integration:
    name: Bazel Integration
    runs-on: ubuntu-24.04
    steps:
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bazel test //tests_system/... //tests_unit/...
  failure:
    name: Check all jobs
    permissions: {}
    needs:
      - lint-code
      - lint-system-tests
      - verify-system-test-entrypoints
      - trlc
      - test
      - integration-tests
      - bazel-integration
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Failure
        run: exit 1
