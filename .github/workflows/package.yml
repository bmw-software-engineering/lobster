name: Lobster PyPI Packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published release tag to package
        required: true
        type: string

permissions:
  contents: read

jobs:

  package:
    name: Build
    runs-on: ubuntu-24.04
    if: inputs.tag_name != '' || github.event.release.target_commitish == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag_name || github.event.release.tag_name }}
          fetch-depth: 0
      - name: Verify release tag is on main
        if: inputs.tag_name != ''
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Verify release is published
        if: inputs.tag_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = false
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install build
      - name: Build Packages
        run: |
          make packages
      - name: Archive wheel files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: |
            packages/*/dist/*.whl
            packages/lobster-monolithic/meta_dist/*.whl

  upload-test:
    name: PyPI Upload
    needs: package
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download wheel files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist_download
      - name: Get whl and gz files
        run: |
          mkdir dist;
          find dist_download -type f -exec mv {} dist \;
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
