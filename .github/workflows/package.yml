name: Lobster PyPI Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:

  package:
    name: Build
    runs-on: ubuntu-24.04
    if: github.event.release.target_commitish == 'main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install build
      - name: Build Packages
        run: |
          make packages
      - name: Archive wheel files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: |
            packages/*/dist/*.whl
            packages/*/meta_dist/*.whl

  upload-test:
    name: PyPI Upload
    needs: package
    runs-on: ubuntu-24.04
    if: github.event.release.target_commitish == 'main'
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download wheel files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist_download
      - name: Get whl and gz files
        run: |
          mkdir dist;
          find dist_download -type f -exec mv {} dist \;
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
