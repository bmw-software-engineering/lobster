name: Publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      registry_fork:
        required: false
        type: string
        default: bmw-software-engineering/bazel-central-registry
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag being released
        required: true
        type: string
      registry_fork:
        description: GitHub fork used to open the BCR PR (owner/repo)
        required: false
        type: string
        default: bmw-software-engineering/bazel-central-registry

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@3b1b972e41764b9a7498cf9128ed4ed2258a3687 # v1.6.0
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: ${{ inputs.registry_fork }}
      draft: false
      attest: true
      tag_prefix: "lobster-"
      download_default_release_artifacts: true
      author_name: "bmw-software-engineering-bot"
      author_email: "296796306+bmw-software-engineering-bot@users.noreply.github.com"
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
